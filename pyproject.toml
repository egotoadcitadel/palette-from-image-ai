[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "palette-from-image-ai"
version = "0.4.2"
description = "Desktop tool that extracts usable color palettes from any image using an AI color-clustering pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "palette-from-image-ai contributors" }]
keywords = ["palette", "color", "image", "ai", "desktop", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "scikit-learn>=1.4.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyperclip>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
palette-ai = "palette_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/palette_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["palette_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=palette_ai --cov-report=term-missing"